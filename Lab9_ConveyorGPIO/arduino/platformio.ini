; Lab 9 - โปรเจค PlatformIO สำหรับ Arduino Uno ที่คุมชุดสายพาน
;
; สั่ง build/upload จากบนตัว Raspberry Pi ได้เลย ไม่ต้องมีเครื่อง Windows
;   cd ~/Lab9_ConveyorGPIO/arduino
;   ~/.platformio/penv/bin/pio run --target upload
;
; ทำไมใช้ PlatformIO ไม่ใช่ Arduino IDE:
; Arduino IDE ต้องมีหน้าจอ แต่เราทำงานกับ Pi ผ่าน SSH เป็นหลัก
; PlatformIO ทำงานบนบรรทัดคำสั่งล้วน ดึง toolchain มาให้เอง
; และเก็บค่าตั้งของโปรเจคไว้ในไฟล์นี้ ซึ่ง commit เข้า git ได้
; เพื่อนในกลุ่มจึง build ได้ผลเหมือนกันโดยไม่ต้องมานั่งตั้งค่าใน IDE ให้ตรงกัน

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Uno บน Raspberry Pi จะขึ้นเป็น /dev/ttyACM0 เสมอถ้าเสียบตัวเดียว
; ระบุไว้ตรง ๆ กันไม่ให้ไปเจอพอร์ตอื่น (เช่นโมดูล Bluetooth ในตัวของ Pi)
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; ต้องตรงกับค่า BAUD ใน src/main.cpp
monitor_speed = 115200

; ตัด \r ออกให้ตอนเปิด monitor เพื่อให้บรรทัดไม่เพี้ยน
monitor_filters = send_on_enter
